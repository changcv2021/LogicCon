# §A.2 backbone. Needs a 32B local snapshot and enough allocated GPU memory.
[backend]
kind = "transformers"
model = "${LOGICCON_MODEL_PATH}"
local_files_only = true
dtype = "bfloat16"
device_map = "auto"
max_new_tokens = 1536
min_pixels = 200704
max_pixels = 802816
seed = 20260926

[method]
mode = "full"
max_iterations = 3
max_claims = 16
format_retries = 1
